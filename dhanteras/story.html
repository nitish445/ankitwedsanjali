<!doctype html>
<html><head><meta charset="utf-8">
<title>Happy Dhanteras – Mehta Constructions</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Tiro+Devanagari+Hindi&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:#3a0714;overflow:hidden}
  .story{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(ellipse 55% 30% at 50% 44%, #5a0f22 0%, #3a0714 70%);color:#e9c46a}
  svg{position:absolute;left:0;top:0}
  .t{position:absolute;left:0;width:100%;text-align:center}
  .hi{top:960px;font-family:'Tiro Devanagari Hindi',serif;font-size:132px;line-height:1.2;color:#f1cf7a}
  .en{top:1140px;font-family:'Cinzel',serif;font-weight:400;font-size:40px;letter-spacing:18px;padding-left:18px;color:#e9c46a}
  .msg{top:1250px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:36px;color:#d9b9a0;opacity:.85}
  .brand{top:1640px}
  .brand .name{font-family:'Cinzel',serif;font-weight:600;font-size:34px;letter-spacing:10px;padding-left:10px;color:#f1cf7a}
  .brand .sub{margin-top:14px;font-family:'Cinzel',serif;font-size:19px;letter-spacing:7px;padding-left:7px;color:#c9a48a}
</style></head>
<body><div class="story">

<svg width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc861" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffc861" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9a2e"/><stop offset=".6" stop-color="#ffd76a"/><stop offset="1" stop-color="#fff4d0"/>
    </linearGradient>
  </defs>

  <!-- single diya -->
  <g transform="translate(540 820)">
    <circle cy="-60" r="190" fill="url(#glow)"/>
    <path d="M0,-150 C22,-110 26,-70 0,-42 C-26,-70 -22,-110 0,-150Z" fill="url(#flame)"/>
    <path d="M-120,-30 C-60,-22 60,-22 120,-30 C104,20 56,40 0,40 C-56,40 -104,20 -120,-30Z"
          fill="none" stroke="#e9c46a" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- thin divider -->
  <line x1="490" y1="1222" x2="590" y2="1222" stroke="#e9c46a" stroke-width="2" opacity=".7"/>

  <!-- brand divider -->
  <line x1="510" y1="1610" x2="570" y2="1610" stroke="#e9c46a" stroke-width="1.5" opacity=".5"/>
</svg>

<div class="t hi">शुभ धनतेरस</div>
<div class="t en">HAPPY DHANTERAS</div>
<div class="t msg">Wishing you prosperity, health &amp; strong foundations.</div>

<div class="t brand">
  <div class="name">MEHTA CONSTRUCTIONS</div>
  <div class="sub">A PRODUCT OF AS ENTERPRISES</div>
</div>

</div></body></html>
