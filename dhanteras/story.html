<!doctype html>
<html><head><meta charset="utf-8">
<title>Happy Dhanteras – Mehta Constructions</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Rozha+One&family=Tiro+Devanagari+Hindi&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:#2a0410;overflow:hidden}
  .story{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:
      radial-gradient(ellipse 70% 45% at 50% 47%, rgba(255,170,60,.28), transparent 70%),
      radial-gradient(ellipse at 50% 40%, #7a1024 0%, #4a0816 45%, #24030c 100%);
    color:#f6d77a;font-family:'Cinzel',serif}
  .gold{background:linear-gradient(180deg,#fff3c4 0%,#f7d774 30%,#d9a02c 60%,#fbe39a 80%,#b67a17 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  svg{position:absolute;left:0;top:0}
  .t{position:absolute;left:0;width:100%;text-align:center}
  .kicker{top:300px;font-family:'Tiro Devanagari Hindi',serif;font-size:38px;letter-spacing:4px;color:#f3c96a}
  .hi{top:350px;font-family:'Rozha One',serif;font-size:190px;line-height:1.15;
      filter:drop-shadow(0 6px 0 #5b0a16) drop-shadow(0 0 30px rgba(255,190,80,.45))}
  .en{top:590px;font-family:'Cinzel Decorative',serif;font-weight:900;font-size:82px;letter-spacing:4px;
      filter:drop-shadow(0 4px 0 #4a0714)}
  .msg{top:1250px;padding:0 120px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;
      font-size:44px;line-height:1.35;color:#fbe6b0}
  .msg b{color:#ffd56b;font-weight:600}
  .brand{top:1668px}
  .brand .name{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:56px;letter-spacing:2px}
  .brand .sub{margin-top:6px;font-family:'Cinzel',serif;font-weight:500;font-size:28px;letter-spacing:9px;color:#f1cf86}
  .brand .sub em{font-style:normal;font-weight:700;color:#ffe08f}
</style></head>
<body><div class="story">

<!-- ===== background + illustration layer ===== -->
<svg width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2bf"/><stop offset=".35" stop-color="#f4cf63"/>
      <stop offset=".7" stop-color="#c88a1e"/><stop offset="1" stop-color="#8a5a0c"/>
    </linearGradient>
    <linearGradient id="gh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6210"/><stop offset=".3" stop-color="#f6d670"/>
      <stop offset=".55" stop-color="#fff4c8"/><stop offset=".8" stop-color="#d79b2a"/><stop offset="1" stop-color="#8a5a0c"/>
    </linearGradient>
    <radialGradient id="coin" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff6cf"/><stop offset=".45" stop-color="#f3c955"/><stop offset="1" stop-color="#a86d12"/>
    </radialGradient>
    <radialGradient id="flame" cx=".5" cy=".75" r=".7">
      <stop offset="0" stop-color="#fffbe6"/><stop offset=".35" stop-color="#ffe06a"/>
      <stop offset=".7" stop-color="#ff8a1c"/><stop offset="1" stop-color="#e2420a" stop-opacity=".2"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd36b" stop-opacity=".75"/><stop offset=".4" stop-color="#ff9a2a" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4708"/><stop offset=".25" stop-color="#d79a2a"/>
      <stop offset=".45" stop-color="#fff0b5"/><stop offset=".65" stop-color="#e8b444"/><stop offset="1" stop-color="#6e3f06"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d670" stop-opacity=".9"/><stop offset="1" stop-color="#b9801c" stop-opacity=".55"/>
    </linearGradient>

    <!-- mandala petal ring -->
    <g id="petal"><path d="M0,-300 C40,-250 40,-200 0,-170 C-40,-200 -40,-250 0,-300Z" fill="none" stroke="#f3c45a" stroke-width="2"/></g>
    <g id="petal2"><path d="M0,-235 C26,-205 26,-170 0,-150 C-26,-170 -26,-205 0,-235Z" fill="#f3c45a" opacity=".55"/></g>

    <!-- coin -->
    <g id="c">
      <ellipse rx="44" ry="44" fill="url(#coin)" stroke="#8a560c" stroke-width="3"/>
      <ellipse rx="34" ry="34" fill="none" stroke="#a8701a" stroke-width="2" opacity=".8"/>
      <text y="15" text-anchor="middle" font-family="Tiro Devanagari Hindi,serif" font-size="42" fill="#9a6210">₹</text>
    </g>

    <!-- diya -->
    <g id="diya">
      <ellipse cx="0" cy="-70" rx="120" ry="130" fill="url(#glow)"/>
      <path d="M-6,-40 C-30,-75 -12,-110 2,-150 C14,-112 34,-78 8,-40 Z" fill="url(#flame)"/>
      <path d="M-2,-46 C-10,-66 -4,-84 2,-100 C8,-84 12,-66 4,-46 Z" fill="#fffbe8" opacity=".9"/>
      <path d="M-110,-30 C-80,-30 -40,-24 0,-24 C40,-24 80,-30 125,-48 C110,-10 90,30 0,34 C-80,30 -108,0 -110,-30Z" fill="url(#pot)" stroke="#6b3c05" stroke-width="3"/>
      <path d="M-104,-28 C-60,-18 60,-18 118,-44" fill="none" stroke="#fff3c0" stroke-width="3" opacity=".8"/>
      <g fill="#7a1024" opacity=".85">
        <circle cx="-60" cy="2" r="6"/><circle cx="-30" cy="10" r="6"/><circle cx="0" cy="13" r="6"/><circle cx="30" cy="10" r="6"/><circle cx="60" cy="2" r="6"/>
      </g>
      <ellipse cx="0" cy="40" rx="70" ry="9" fill="#000" opacity=".25"/>
    </g>

    <!-- hanging lantern -->
    <g id="lamp">
      <line x1="0" y1="0" x2="0" y2="1" stroke="#e5b54c" stroke-width="2"/>
      <path d="M-22,0 L22,0 L30,18 L-30,18Z" fill="url(#gh)"/>
      <path d="M-30,18 C-44,50 -44,80 -26,104 L26,104 C44,80 44,50 30,18Z" fill="#c2182f" stroke="#f3c45a" stroke-width="3"/>
      <path d="M0,18 L0,104 M-16,20 C-24,50 -24,80 -14,104 M16,20 C24,50 24,80 14,104" stroke="#f3c45a" stroke-width="2" fill="none" opacity=".8"/>
      <ellipse cx="0" cy="62" rx="26" ry="34" fill="#ffcf5a" opacity=".35"/>
      <path d="M-26,104 L26,104 L18,116 L-18,116Z" fill="url(#gh)"/>
      <path d="M-10,116 L-14,150 M0,116 L0,156 M10,116 L14,150" stroke="#f3c45a" stroke-width="3"/>
    </g>

    <pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.6" fill="#f3c45a" opacity=".22"/>
    </pattern>
  </defs>

  <rect width="1080" height="1920" fill="url(#dots)"/>

  <!-- ornate border -->
  <rect x="34" y="34" width="1012" height="1852" rx="28" fill="none" stroke="url(#gh)" stroke-width="4"/>
  <rect x="50" y="50" width="980" height="1820" rx="20" fill="none" stroke="#e6b24a" stroke-width="1.5" opacity=".6"/>
  <g fill="url(#gh)">
    <path d="M34,120 Q34,34 120,34 L150,34 Q60,60 60,150Z"/>
    <path d="M1046,120 Q1046,34 960,34 L930,34 Q1020,60 1020,150Z"/>
    <path d="M34,1800 Q34,1886 120,1886 L150,1886 Q60,1860 60,1770Z"/>
    <path d="M1046,1800 Q1046,1886 960,1886 L930,1886 Q1020,1860 1020,1770Z"/>
  </g>

  <!-- marigold toran -->
  <path d="M50,60 Q270,150 540,105 Q810,150 1030,60" fill="none" stroke="#2f7a2a" stroke-width="4"/>
  <g id="toran">
  </g>

  <!-- hanging lanterns -->
  <line x1="140" y1="50" x2="140" y2="150" stroke="#e5b54c" stroke-width="2"/>
  <use href="#lamp" x="140" y="150"/>
  <line x1="940" y1="50" x2="940" y2="150" stroke="#e5b54c" stroke-width="2"/>
  <use href="#lamp" x="940" y="150"/>
  <line x1="260" y1="50" x2="260" y2="100" stroke="#e5b54c" stroke-width="2"/>
  <use href="#lamp" x="260" y="100" transform="translate(260 100) scale(.7) translate(-260 -100)"/>
  <line x1="820" y1="50" x2="820" y2="100" stroke="#e5b54c" stroke-width="2"/>
  <use href="#lamp" x="820" y="100" transform="translate(820 100) scale(.7) translate(-820 -100)"/>

  <!-- divider under English title -->
  <g transform="translate(540 712)">
    <line x1="-300" y1="0" x2="-40" y2="0" stroke="url(#gh)" stroke-width="3"/>
    <line x1="40" y1="0" x2="300" y2="0" stroke="url(#gh)" stroke-width="3"/>
    <path d="M0,-18 L18,0 L0,18 L-18,0Z" fill="url(#g)"/>
    <circle cx="-310" r="6" fill="#f3c45a"/><circle cx="310" r="6" fill="#f3c45a"/>
  </g>

  <!-- mandala -->
  <g id="mandala" transform="translate(540 1000)" opacity=".8"></g>

  <!-- pot of gold (kalash) -->
  <g transform="translate(540 1010)">
    <ellipse cx="0" cy="-40" rx="230" ry="210" fill="url(#glow)" opacity=".8"/>
    <!-- coins overflowing on top -->
    <use href="#c" x="-70" y="-110" transform="rotate(-12 -70 -110)"/>
    <use href="#c" x="70" y="-112" transform="rotate(14 70 -112)"/>
    <use href="#c" x="-20" y="-140"/>
    <use href="#c" x="30" y="-150" transform="rotate(8 30 -150)"/>
    <use href="#c" x="0" y="-190"/>
    <!-- pot body -->
    <path d="M-110,-90 C-150,-60 -190,0 -170,70 C-150,140 -80,170 0,170 C80,170 150,140 170,70 C190,0 150,-60 110,-90Z" fill="url(#pot)" stroke="#6b3c05" stroke-width="4"/>
    <ellipse cx="0" cy="-92" rx="118" ry="24" fill="url(#gh)" stroke="#6b3c05" stroke-width="3"/>
    <ellipse cx="0" cy="-92" rx="96" ry="14" fill="#5a330a"/>
    <use href="#c" x="-40" y="-104" transform="translate(-40 -104) scale(1 .45) translate(40 104)"/>
    <use href="#c" x="38" y="-102" transform="translate(38 -102) scale(1 .45) translate(-38 102)"/>
    <!-- band + swastik-free auspicious motif: shubh -->
    <path d="M-176,30 C-100,55 100,55 176,30" fill="none" stroke="#7a1024" stroke-width="14" opacity=".9"/>
    <path d="M-176,30 C-100,55 100,55 176,30" fill="none" stroke="#f6d670" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <text x="0" y="122" text-anchor="middle" font-family="Rozha One,serif" font-size="58" fill="#7a1024" opacity=".9">शुभ लाभ</text>
    <path d="M-120,-40 C-130,0 -125,40 -100,80" stroke="#fff6cf" stroke-width="8" fill="none" opacity=".45" stroke-linecap="round"/>
    <ellipse cx="0" cy="178" rx="160" ry="16" fill="#000" opacity=".3"/>
  </g>

  <!-- coins spilled + stacks -->
  <g>
    <use href="#c" x="300" y="1170" transform="translate(300 1170) scale(1 .4) translate(-300 -1170)"/>
    <use href="#c" x="300" y="1160" transform="translate(300 1160) scale(1 .4) translate(-300 -1160)"/>
    <use href="#c" x="300" y="1150" transform="translate(300 1150) scale(1 .4) translate(-300 -1150)"/>
    <use href="#c" x="300" y="1140" transform="translate(300 1140) scale(1 .4) translate(-300 -1140)"/>
    <use href="#c" x="780" y="1170" transform="translate(780 1170) scale(1 .4) translate(-780 -1170)"/>
    <use href="#c" x="780" y="1160" transform="translate(780 1160) scale(1 .4) translate(-780 -1160)"/>
    <use href="#c" x="780" y="1150" transform="translate(780 1150) scale(1 .4) translate(-780 -1150)"/>
    <use href="#c" x="780" y="1140" transform="translate(780 1140) scale(1 .4) translate(-780 -1140)"/>
    <use href="#c" x="780" y="1130" transform="translate(780 1130) scale(1 .4) translate(-780 -1130)"/>
    <use href="#c" x="410" y="1185" transform="translate(410 1185) scale(.7) rotate(-10) translate(-410 -1185)"/>
    <use href="#c" x="680" y="1188" transform="translate(680 1188) scale(.7) rotate(12) translate(-680 -1188)"/>
  </g>

  <!-- diyas -->
  <use href="#diya" x="175" y="1170" transform="translate(175 1170) scale(.85) translate(-175 -1170)"/>
  <use href="#diya" x="905" y="1170" transform="translate(905 1170) scale(.85) translate(-905 -1170)"/>

  <!-- rangoli line under illustration -->
  <g transform="translate(540 1222)">
    <path d="M-420,0 Q-210,-14 0,0 Q210,14 420,0" fill="none" stroke="url(#gh)" stroke-width="3"/>
    <g fill="#f3c45a"><circle cx="-420" r="5"/><circle cx="420" r="5"/></g>
  </g>

  <!-- gold skyline (construction) -->
  <g transform="translate(0 1645) scale(1 .62)" fill="url(#sky)" opacity=".5">
    <path d="M60,0 V-60 H120 V-110 H170 V-60 H210 V-150 H260 V-170 H300 V-150 H330 V-80 H380 V-200 H440 V-230 H470 V-200 H500 V-90 H540 V-130 H590 V-250 H650 V-130 H690 V-180 H740 V-100 H780 V-160 H840 V-70 H880 V-120 H930 V-50 H1020 V0Z"/>
    <!-- crane -->
    <path d="M880,-120 V-300 H890 V-120Z M800,-300 H1000 V-290 H800Z M884,-300 L884,-330 L892,-300Z"/>
    <path d="M980,-290 V-230" stroke="#f6d670" stroke-width="2" opacity=".9"/>
    <rect x="970" y="-232" width="20" height="14"/>
  </g>
  <g transform="translate(0 1645) scale(1 .62)" fill="#2a0410" opacity=".55">
    <!-- windows -->
    <g id="win"></g>
  </g>
  <line x1="60" y1="1645" x2="1020" y2="1645" stroke="url(#gh)" stroke-width="3"/>

  <!-- sparkles -->
  <g id="spark" fill="#fff1bf"></g>
</svg>

<div class="t kicker">॥ धन • धान्य • समृद्धि ॥</div>
<div class="t hi gold">शुभ धनतेरस</div>
<div class="t en gold">Happy Dhanteras</div>

<div class="t msg">May Maa Lakshmi &amp; Lord Dhanvantari bless your home with <b>wealth, health &amp; prosperity</b> — and lay a strong foundation for every dream you build.</div>

<div class="t brand">
  <div class="name gold">MEHTA CONSTRUCTIONS</div>
  <div class="sub">A PRODUCT OF <em>AS ENTERPRISES</em></div>
</div>

</div>
<script>
const NS='http://www.w3.org/2000/svg';
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
// mandala rings
const m=document.getElementById('mandala');
for(let i=0;i<24;i++){m.appendChild(mk('use',{href:'#petal',transform:`rotate(${i*15})`}));}
for(let i=0;i<16;i++){m.appendChild(mk('use',{href:'#petal2',transform:`rotate(${i*22.5+11.25})`}));}
[310,325,145].forEach((r,i)=>m.appendChild(mk('circle',{r,fill:'none',stroke:'#f3c45a','stroke-width':i==1?1:2,'stroke-dasharray':i==1?'3 9':''})));
// marigold toran
const t=document.getElementById('toran');
const q=(p0,p1,p2,s)=>[(1-s)**2*p0[0]+2*(1-s)*s*p1[0]+s*s*p2[0],(1-s)**2*p0[1]+2*(1-s)*s*p1[1]+s*s*p2[1]];
const segs=[[[50,60],[270,150],[540,105]],[[540,105],[810,150],[1030,60]]];
segs.forEach(sg=>{for(let i=0;i<=16;i++){const [x,y]=q(...sg,i/16);
  const col=i%2?'#ff9f1a':'#ffcc1f';
  t.appendChild(mk('circle',{cx:x,cy:y,r:13,fill:col,stroke:'#d9700a','stroke-width':2}));
  t.appendChild(mk('circle',{cx:x,cy:y,r:5,fill:'#e06a00'}));
  if(i%4==2){t.appendChild(mk('path',{d:`M${x},${y+12} q-10,24 0,40 q10,-16 0,-40`,fill:'#3b8f2e'}));}
}});
// windows on skyline
const w=document.getElementById('win');
[[230,-140,2,5],[400,-190,3,6],[600,-240,3,8],[700,-170,2,5],[795,-150,3,4],[130,-100,2,3],[520,-80,2,2],[890,-110,2,3]].forEach(([x0,y0,c,r])=>{
  for(let a=0;a<c;a++)for(let b=0;b<r;b++)w.appendChild(mk('rect',{x:x0+a*14,y:y0+b*26,width:8,height:14}));
});
// sparkles
const sp=document.getElementById('spark');
const star=(x,y,s,o)=>sp.appendChild(mk('path',{d:`M${x},${y-s} Q${x},${y} ${x+s},${y} Q${x},${y} ${x},${y+s} Q${x},${y} ${x-s},${y} Q${x},${y} ${x},${y-s}Z`,opacity:o}));
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
for(let i=0;i<55;i++){const x=70+rnd()*940,y=230+rnd()*1300;
  if(y>330&&y<730&&x>110&&x<970)continue; // keep titles clean
  if(y>800&&y<1240&&x>330&&x<750)continue;
  if(y>1235)continue;
  star(x,y,4+rnd()*12,.35+rnd()*.6);}
</script>
</body></html>
